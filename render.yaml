# Render deployment configuration.
# Defines how Render should build and start this FastAPI service.
services:
  - type: web
    name: fastapi-blog
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
